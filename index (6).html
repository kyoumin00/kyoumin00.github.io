<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 노래 | 기분과 날씨로 고르는 음악</title>
<meta name="description" content="지금 기분과 날씨를 고르면 어울리는 노래를 추천해 드려요.">
<style>
  :root {
    --bg: #f6f7fb; --fg: #1e2230; --muted: #5f667a;
    --card: #ffffff; --line: #e1e4ee; --accent: #6c5ce7; --accent-soft: #ece9ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141c; --fg: #eef0f6; --muted: #9aa1b5;
      --card: #1b1f2b; --line: #2a3042; --accent: #8c7dff; --accent-soft: #272446;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 18px 60px; }
  header { text-align: center; padding: 48px 0 28px; }
  header h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 38px); }
  header p { margin: 0; color: var(--muted); }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    padding: 9px 15px; border-radius: 99px; cursor: pointer; font-size: 15px;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .ghost {
    border: 1px dashed var(--accent); background: transparent; color: var(--accent);
    padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .ghost:disabled { opacity: .5; cursor: default; }
  .status { font-size: 14px; color: var(--muted); }
  .go {
    width: 100%; margin-top: 4px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .go:hover { filter: brightness(1.08); }
  #result { margin-top: 24px; }
  #result h2 { font-size: 18px; margin: 0 0 12px; }
  .song {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
  }
  .song .t { font-weight: 700; }
  .song .a { color: var(--muted); font-size: 14px; }
  .song .m { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 9px; border-radius: 99px; }
  .play {
    flex-shrink: 0; text-decoration: none; color: var(--accent); font-weight: 600;
    border: 1px solid var(--accent); padding: 7px 12px; border-radius: 10px; font-size: 14px;
  }
  .play:hover { background: var(--accent-soft); }
  .again { margin-top: 6px; background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 15px; font-family: inherit; padding: 6px 0; }
  .empty { color: var(--muted); text-align: center; padding: 12px 0; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎧 오늘의 노래</h1>
    <p>지금 기분과 날씨를 고르면, 어울리는 노래를 골라 드려요.</p>
  </header>

  <div class="panel">
    <h2>1. 지금 기분은?</h2>
    <div class="chips" id="moods"></div>
  </div>

  <div class="panel">
    <h2>2. 오늘 날씨는?</h2>
    <div class="chips" id="weathers"></div>
    <div class="row">
      <button class="ghost" id="locate" type="button">📍 현재 날씨 자동으로 불러오기</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <button class="go" id="go" type="button">노래 추천받기</button>

  <div id="result"></div>

  <footer>노래 제목을 누르면 유튜브 검색 결과가 새 탭에서 열려요.</footer>
</div>

<script>
(() => {
  const MOODS = [
    ['행복', '😊'], ['신남', '🥳'], ['설렘', '💗'],
    ['평온', '😌'], ['슬픔', '😢'], ['지침', '😮‍💨']
  ];
  const WEATHERS = [
    ['맑음', '☀️'], ['흐림', '☁️'], ['비', '🌧️'], ['눈', '❄️']
  ];

  // t: 제목, a: 아티스트, m: 어울리는 기분, w: 어울리는 날씨
  const SONGS = [
    { t: '좋은 날', a: '아이유', m: ['행복', '신남'], w: ['맑음'] },
    { t: '벚꽃 엔딩', a: '버스커 버스커', m: ['설렘', '행복'], w: ['맑음'] },
    { t: '봄봄봄', a: '로이킴', m: ['설렘', '행복'], w: ['맑음'] },
    { t: 'Dynamite', a: 'BTS', m: ['신남', '행복'], w: ['맑음'] },
    { t: 'Happy', a: 'Pharrell Williams', m: ['행복', '신남'], w: ['맑음'] },
    { t: 'Here Comes the Sun', a: 'The Beatles', m: ['행복', '평온'], w: ['맑음'] },
    { t: "I'm Yours", a: 'Jason Mraz', m: ['행복', '평온'], w: ['맑음'] },
    { t: 'What a Wonderful World', a: 'Louis Armstrong', m: ['평온', '행복'], w: ['맑음'] },
    { t: '여행', a: '볼빨간사춘기', m: ['행복', '평온'], w: ['맑음'] },
    { t: 'Hype Boy', a: 'NewJeans', m: ['설렘', '신남'], w: ['맑음'] },
    { t: '사랑은 은하수 다방에서', a: '10cm', m: ['설렘'], w: ['맑음', '흐림'] },
    { t: 'EVERYTHING', a: '검정치마', m: ['설렘'], w: ['맑음', '흐림'] },
    { t: '두 사람', a: '성시경', m: ['설렘', '평온'], w: ['흐림'] },
    { t: 'Perfect', a: 'Ed Sheeran', m: ['설렘', '평온'], w: ['눈', '흐림'] },
    { t: 'Gee', a: '소녀시대', m: ['신남'], w: ['맑음'] },
    { t: '챔피언', a: '싸이', m: ['신남'], w: ['맑음'] },
    { t: 'Uptown Funk', a: 'Mark Ronson ft. Bruno Mars', m: ['신남'], w: ['맑음'] },
    { t: "Don't Stop Me Now", a: 'Queen', m: ['신남'], w: ['맑음', '흐림'] },
    { t: 'Shake It Off', a: 'Taylor Swift', m: ['신남', '행복'], w: ['맑음', '흐림'] },
    { t: '밤편지', a: '아이유', m: ['평온', '설렘'], w: ['흐림'] },
    { t: '가을 아침', a: '아이유', m: ['평온'], w: ['흐림'] },
    { t: '사계', a: '태연', m: ['평온', '설렘'], w: ['눈', '흐림'] },
    { t: 'Clair de Lune', a: 'Claude Debussy', m: ['평온'], w: ['흐림', '눈'] },
    { t: "Don't Know Why", a: 'Norah Jones', m: ['평온', '슬픔'], w: ['비', '흐림'] },
    { t: '비처럼 음악처럼', a: '김현식', m: ['평온', '슬픔'], w: ['비'] },
    { t: '붉은 노을', a: '이문세', m: ['평온', '지침'], w: ['흐림', '맑음'] },
    { t: '오랜 날 오랜 밤', a: '악동뮤지션', m: ['슬픔', '평온'], w: ['흐림'] },
    { t: '비', a: '폴킴', m: ['슬픔'], w: ['비'] },
    { t: '우산', a: '에픽하이 (feat. 윤하)', m: ['슬픔'], w: ['비'] },
    { t: 'Someone Like You', a: 'Adele', m: ['슬픔'], w: ['비', '흐림'] },
    { t: 'All I Want', a: 'Kodaline', m: ['슬픔'], w: ['비'] },
    { t: "when the party's over", a: 'Billie Eilish', m: ['슬픔', '지침'], w: ['흐림'] },
    { t: '눈의 꽃', a: '박효신', m: ['슬픔', '설렘'], w: ['눈'] },
    { t: '봄날', a: '방탄소년단', m: ['슬픔'], w: ['눈'] },
    { t: '주저하는 연인들을 위해', a: '잔나비', m: ['설렘', '슬픔'], w: ['흐림'] },
    { t: 'Fix You', a: 'Coldplay', m: ['지침', '슬픔'], w: ['흐림', '비'] },
    { t: 'Lean on Me', a: 'Bill Withers', m: ['지침'], w: ['맑음', '흐림'] },
    { t: '걱정 말아요 그대', a: '이적', m: ['지침'], w: ['흐림', '눈'] },
    { t: 'Have You Ever Seen the Rain?', a: 'Creedence Clearwater Revival', m: ['지침'], w: ['비'] },
    { t: "Don't Look Back in Anger", a: 'Oasis', m: ['지침'], w: ['흐림'] },
    { t: 'Let It Snow! Let It Snow! Let It Snow!', a: 'Dean Martin', m: ['행복', '설렘'], w: ['눈'] },
    { t: 'All I Want for Christmas Is You', a: 'Mariah Carey', m: ['신남', '설렘', '행복'], w: ['눈'] }
  ];

  let mood = null, weather = null;
  const $ = id => document.getElementById(id);

  function makeChips(boxId, items, onPick) {
    const box = $(boxId);
    items.forEach(([name, emoji]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.name = name;
      b.textContent = emoji + ' ' + name;
      b.addEventListener('click', () => onPick(name));
      box.appendChild(b);
    });
  }

  function mark(boxId, name) {
    document.querySelectorAll('#' + boxId + ' .chip').forEach(c => {
      c.classList.toggle('on', c.dataset.name === name);
    });
  }

  function setMood(n) { mood = (mood === n) ? null : n; mark('moods', mood); }
  function setWeather(n) { weather = (weather === n) ? null : n; mark('weathers', weather); }

  makeChips('moods', MOODS, setMood);
  makeChips('weathers', WEATHERS, setWeather);

  function pick() {
    const scored = SONGS.map(s => ({
      s,
      sc: (mood && s.m.includes(mood) ? 1 : 0) + (weather && s.w.includes(weather) ? 1 : 0),
      r: Math.random()
    }));
    scored.sort((x, y) => (y.sc - x.sc) || (x.r - y.r));
    return scored.filter(x => x.sc > 0).slice(0, 5);
  }

  function render() {
    const box = $('result');
    box.textContent = '';
    if (!mood && !weather) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '기분이나 날씨를 하나 이상 골라 주세요.';
      box.appendChild(p);
      return;
    }
    const list = pick();
    const h = document.createElement('h2');
    h.textContent = [mood, weather].filter(Boolean).join(' · ') + '에 어울리는 노래';
    box.appendChild(h);

    list.forEach(({ s, sc }) => {
      const row = document.createElement('div');
      row.className = 'song';

      const info = document.createElement('div');
      const t = document.createElement('div'); t.className = 't'; t.textContent = s.t;
      const a = document.createElement('div'); a.className = 'a'; a.textContent = s.a;
      info.append(t, a);
      if (mood && weather) {
        const m = document.createElement('span');
        m.className = 'm';
        m.textContent = sc === 2 ? '기분 + 날씨 딱 맞아요' : (s.m.includes(mood) ? '기분에 어울려요' : '날씨에 어울려요');
        info.appendChild(m);
      }

      const link = document.createElement('a');
      link.className = 'play';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(s.a + ' ' + s.t);
      link.textContent = '▶ 듣기';

      row.append(info, link);
      box.appendChild(row);
    });

    const again = document.createElement('button');
    again.className = 'again';
    again.type = 'button';
    again.textContent = '🔄 다른 노래로 다시 추천';
    again.addEventListener('click', render);
    box.appendChild(again);
  }

  $('go').addEventListener('click', render);

  // 현재 날씨 자동 불러오기 (Open-Meteo, API 키 불필요)
  function codeToWeather(c) {
    if (c === 0 || c === 1) return '맑음';
    if (c === 2 || c === 3 || c === 45 || c === 48) return '흐림';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return '눈';
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95) return '비';
    return '흐림';
  }

  $('locate').addEventListener('click', () => {
    const st = $('status'), btn = $('locate');
    if (!navigator.geolocation) { st.textContent = '이 브라우저는 위치 기능을 지원하지 않아요. 직접 골라 주세요.'; return; }
    btn.disabled = true;
    st.textContent = '위치 확인 중…';
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const { latitude, longitude } = pos.coords;
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + latitude +
          '&longitude=' + longitude + '&current=temperature_2m,weather_code';
        const res = await fetch(url);
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        const w = codeToWeather(data.current.weather_code);
        weather = w;
        mark('weathers', w);
        st.textContent = '현재 ' + Math.round(data.current.temperature_2m) + '°C · ' + w;
      } catch (e) {
        st.textContent = '날씨를 불러오지 못했어요. 직접 골라 주세요.';
      } finally {
        btn.disabled = false;
      }
    }, () => {
      st.textContent = '위치 권한이 없어요. 직접 골라 주세요.';
      btn.disabled = false;
    }, { timeout: 8000 });
  });
})();
</script>
</body>
</html>
